name: publish-dsh-sqlite

on:
  push:
    tags:
      - 'dsh-sqlite-v*'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Publish @cxxl/dsh-sqlite
        working-directory: plugins/dsh-sqlite
        run: npm publish --access public
        env:
          # npm Automation 令牌（CI 专用，可绕过 2FA；存入仓库 Secrets）
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
