# dsh-canvas bundle patch：安装时把本包的行插入 profile 组合。
# 安装三通道（任选其一；不要 add 本地目录——junction 悬空陷阱，见 docs/PLUGIN_SPEC.md §8）：
#   dsh plugin --profile <name> add @cxxl/dsh-canvas              # npm 发布版
#   dsh plugin --profile <name> add ./cxxl-dsh-canvas-<版本>.tgz   # tarball（本地开发）
#   dsh plugin --profile <name> add github:happyCxxl/dsh-plugins#<sha>
# 装完必须重启（bundle 层只在 boot 时读取）；行 id 在 profile 的 bundle 层内保持唯一。
- insert:
    - id: dsh-canvas
      name: '@cxxl/dsh-canvas'
